name: Backend Build

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-build.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build backend
        working-directory: backend
        run: ./gradlew build
