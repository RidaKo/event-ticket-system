spring:
  application:
    name: event-ticket-system
  profiles:
    default: local
    group:
      local:
        - seed
  config:
    import: optional:classpath:application-local.yaml
  datasource:
    url: jdbc:h2:mem:mydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: password
    driverClassName: org.h2.Driver
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
  thymeleaf:
    cache: false
  flyway:
    enabled: true
    locations: classpath:db/migration

event-ticket:
  audit:
    enabled: ${BUSINESS_AUDIT_ENABLED:true}
  email:
    sender: ${EMAIL_SENDER:log}
    from-address: ${MAIL_FROM:no-reply@event-ticket.local}
  seed:
    enabled: true

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

app:
  jwt:
    secret: ${APP_JWT_SECRET:dev-secret-change-me-please-32-chars-or-more}
    expiration-minutes: 60
  security:
    dev-endpoints-enabled: ${APP_SECURITY_DEV_ENDPOINTS_ENABLED:true}
  tickets:
    public-api-base-url: ${APP_TICKETS_PUBLIC_API_BASE_URL:http://localhost:8080}
    public-frontend-base-url: ${APP_TICKETS_PUBLIC_FRONTEND_BASE_URL:http://127.0.0.1:5173}
