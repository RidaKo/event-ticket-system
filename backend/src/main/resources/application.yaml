spring:
  application:
    name: event-ticket-system
  datasource:
    url: jdbc:h2:mem:mydb
    username: sa
    password: password
    driverClassName: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    defer-datasource-initialization: false
  thymeleaf:
    cache: false
  flyway:
    ddl-auto: validate
    enabled: true
